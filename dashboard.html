<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Control - Minimarket Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; overflow: hidden; }
        .sidebar-item.active { background: linear-gradient(135deg, #059669 0%, #10b981 100%); color: white; box-shadow: 0 10px 15px -3px rgba(16, 185, 129, 0.3); }
        iframe { width: 100%; height: 100%; border: none; }
        .sidebar-open { transform: translateX(0) !important; }
        /* Backdrop para cuando el menú se abre */
        #backdrop { transition: opacity 0.3s ease; }
    </style>
</head>
<body class="bg-slate-900 flex h-screen overflow-hidden">

    <!-- Backdrop oscuro cuando el menú está abierto -->
    <div id="backdrop" onclick="toggleMenu()" class="fixed inset-0 bg-slate-950/60 backdrop-blur-sm z-40 hidden"></div>

    <!-- Menú lateral flotante y colapsable -->
    <aside id="sidebar" class="fixed inset-y-0 left-0 z-50 w-72 bg-white shadow-2xl transform -translate-x-full transition-transform duration-300 flex flex-col border-r border-slate-100">
        <div class="p-6 flex items-center justify-between bg-slate-50 border-b border-slate-100">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-gradient-to-tr from-emerald-600 to-teal-400 rounded-xl flex items-center justify-center shadow-md shadow-emerald-500/20">
                    <span class="text-white font-black text-lg">M</span>
                </div>
                <span class="text-xl font-black text-slate-800 tracking-tight">Minimarket<span class="text-emerald-600">Pro</span></span>
            </div>
            <button onclick="toggleMenu()" class="w-8 h-8 rounded-full bg-slate-200/60 flex items-center justify-center text-slate-600 font-bold hover:bg-slate-200 transition">&times;</button>
        </div>

        <nav class="flex-1 p-4 space-y-2 overflow-y-auto">
            <button onclick="navegar('ventas.html', this)" class="sidebar-item active w-full flex items-center gap-4 px-4 py-3.5 rounded-2xl font-bold text-slate-600 hover:bg-emerald-50 hover:text-emerald-600 transition-all">
                <span class="text-xl">🛒</span> Caja Rápida
            </button>
            <button onclick="navegar('inventario.html', this)" class="sidebar-item w-full flex items-center gap-4 px-4 py-3.5 rounded-2xl font-bold text-slate-600 hover:bg-emerald-50 hover:text-emerald-600 transition-all">
                <span class="text-xl">📦</span> Inventario
            </button>
            <button onclick="navegar('clientes.html', this)" class="sidebar-item w-full flex items-center gap-4 px-4 py-3.5 rounded-2xl font-bold text-slate-600 hover:bg-emerald-50 hover:text-emerald-600 transition-all">
                <span class="text-xl">👥</span> Clientes / Fiados
            </button>
            <button onclick="navegar('egresos.html', this)" class="sidebar-item w-full flex items-center gap-4 px-4 py-3.5 rounded-2xl font-bold text-slate-600 hover:bg-emerald-50 hover:text-emerald-600 transition-all">
                <span class="text-xl">💸</span> Egresos / Gastos
            </button>
            <button onclick="navegar('reportes.html', this)" class="sidebar-item w-full flex items-center gap-4 px-4 py-3.5 rounded-2xl font-bold text-slate-600 hover:bg-emerald-50 hover:text-emerald-600 transition-all">
                <span class="text-xl">📊</span> Reportes
            </button>
        </nav>

        <div class="p-4 bg-slate-50 border-t border-slate-100">
            <button onclick="cerrarSesion()" class="w-full flex items-center justify-center gap-2 py-3 bg-red-50 text-red-600 rounded-xl font-bold hover:bg-red-100 transition shadow-sm">
                <span>🚪</span> Cerrar Sesión
            </button>
        </div>
    </aside>

    <!-- Contenido Principal con Pantalla Completa -->
    <div class="flex-1 flex flex-col min-w-0 overflow-hidden bg-slate-100">
        <header class="h-16 bg-white border-b border-slate-200/80 flex items-center justify-between px-6 shadow-sm z-30">
            <div class="flex items-center gap-4">
                <button onclick="toggleMenu()" class="p-2 rounded-xl bg-emerald-50 text-emerald-700 hover:bg-emerald-100 transition font-black flex items-center gap-2 text-sm">
                    <span class="text-lg">☰</span> Menú
                </button>
                <div class="flex items-center gap-2">
                    <div class="w-3 h-3 rounded-full bg-emerald-500 animate-pulse"></div>
                    <span class="text-xs font-bold text-slate-500 uppercase tracking-wider">Modo Staging</span>
                </div>
            </div>
            
            <div class="flex items-center gap-3 bg-slate-50 px-4 py-2 rounded-2xl border border-slate-200/60 shadow-inner">
                <span id="user-email" class="text-xs font-bold text-slate-600">Cargando...</span>
                <div class="w-7 h-7 bg-emerald-600 text-white rounded-full flex items-center justify-center font-black text-xs shadow-md">U</div>
            </div>
        </header>

        <main class="flex-1 relative overflow-hidden">
            <iframe src="ventas.html" id="visor" allow="camera; microphone"></iframe>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const supabaseUrl = 'https://ijyhkbiukiqiqjabpubm.supabase.co';
        const supabaseKey = 'sb_publishable_EpJx4G5egW9GZdj8P7oudw_kDWWsj6p';
        const _supabase = supabase.createClient(supabaseUrl, supabaseKey);

        function toggleMenu() {
            const sidebar = document.getElementById('sidebar');
            const backdrop = document.getElementById('backdrop');
            sidebar.classList.toggle('sidebar-open');
            backdrop.classList.toggle('hidden');
        }

        async function verificarSesion() {
            try {
                const { data: { user } } = await _supabase.auth.getUser();
                if (!user) window.location.href = 'index.html';
                else document.getElementById('user-email').textContent = user.email;
            } catch (e) {
                console.error("Error de sesión", e);
            }
        }

        function navegar(url, btn) {
            const visor = document.getElementById('visor');
            visor.src = url;
            
            document.querySelectorAll('.sidebar-item').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            
            toggleMenu(); // Cierra el menú al navegar
        }

        async function cerrarSesion() {
            await _supabase.auth.signOut();
            window.location.href = 'index.html';
        }

        verificarSesion();
    </script>
</body>
</html>
