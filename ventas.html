<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Caja Rápida - Minimarket Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #090d16; overflow: hidden; }
        .custom-scroll::-webkit-scrollbar { width: 6px; }
        .custom-scroll::-webkit-scrollbar-track { background: #0f172a; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
    </style>
</head>
<body class="h-screen flex flex-col p-2.5 gap-2.5 overflow-hidden">

    <!-- Contenedor Principal Estilo POS Premium -->
    <div class="bg-slate-900 flex-1 rounded-2xl shadow-2xl flex flex-col overflow-hidden border border-slate-800">
        
        <!-- Cabecera Elegante -->
        <div class="bg-gradient-to-r from-emerald-600 via-teal-600 to-emerald-700 px-5 py-3 flex items-center justify-between text-white shadow-lg flex-shrink-0">
            <div class="flex items-center gap-3">
                <span class="text-2xl bg-white/10 p-1.5 rounded-xl backdrop-blur-sm">🛒</span>
                <div>
                    <h1 class="text-base font-black tracking-wider uppercase">Caja Registradora</h1>
                    <p class="text-[10px] text-emerald-100 font-semibold tracking-wide">TERMINAL DE VENTA RÁPIDA</p>
                </div>
            </div>
            <p class="text-xs font-bold uppercase bg-slate-950/30 px-3.5 py-1.5 rounded-xl border border-white/10 backdrop-blur-md" id="user-display">Verificando...</p>
        </div>

        <!-- Layout de 2 Columnas Estilizado -->
        <div class="flex-1 grid grid-cols-1 lg:grid-cols-12 p-3.5 gap-3.5 overflow-hidden">
            
            <!-- Izquierda: Buscador y Tabla de Inventario (Estilo Oscuro Integrado) -->
            <div class="lg:col-span-7 flex flex-col gap-3 overflow-hidden bg-slate-950/50 p-3.5 rounded-2xl border border-slate-800 shadow-inner">
                
                <!-- Buscador Moderno -->
                <div class="flex items-center gap-2.5 bg-slate-900 p-2 rounded-xl border border-slate-700/80 shadow-md flex-shrink-0">
                    <div class="flex-1 relative flex items-center">
                        <input type="text" id="inputBusqueda" placeholder="🔍 BUSCAR PRODUCTO O ESCANEAR CÓDIGO..." class="w-full bg-slate-950 px-4 py-2.5 rounded-lg font-bold text-slate-100 placeholder-slate-500 outline-none focus:ring-2 focus:ring-emerald-500 text-xs">
                    </div>
                    <button id="btnCamara" onclick="toggleLector()" class="bg-slate-800 hover:bg-slate-700 text-emerald-400 border border-slate-700 px-3.5 py-2.5 rounded-lg font-bold text-xs flex items-center gap-2 shadow transition">
                        <span>📷</span> Cámara
                    </button>
                </div>

                <!-- Lector de Cámara -->
                <div id="lectorContainer" class="hidden relative bg-black rounded-xl overflow-hidden h-36 flex-shrink-0 border border-slate-800">
                    <div id="reader" class="w-full h-full"></div>
                </div>

                <!-- Tabla de Productos Oscura y Elegante -->
                <div class="flex-1 overflow-y-auto custom-scroll border border-slate-800 rounded-xl bg-slate-900/90 shadow-lg">
                    <table class="w-full text-left border-collapse">
                        <thead class="bg-slate-800/90 text-slate-300 uppercase text-[11px] sticky top-0 font-extrabold z-10 tracking-wider">
                            <tr>
                                <th class="p-3">Descripción</th>
                                <th class="p-3">Precio</th>
                                <th class="p-3">Stock</th>
                                <th class="p-3 text-center">Acción</th>
                            </tr>
                        </thead>
                        <tbody id="tablaResultados" class="divide-y divide-slate-800/60 text-xs font-semibold text-slate-300">
                            <!-- Productos inyectados por ventas.js -->
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- Derecha: Panel de Resumen y Cobro -->
            <div class="lg:col-span-5 bg-slate-950 text-white rounded-2xl p-3.5 flex flex-col justify-between shadow-xl border border-slate-800 overflow-hidden">
                
                <!-- Cabecera Resumen -->
                <div class="flex items-center justify-between border-b border-slate-800 pb-2.5 mb-2 flex-shrink-0">
                    <span class="font-extrabold text-xs uppercase tracking-wider text-slate-300 flex items-center gap-2">
                        <span>📄</span> RESUMEN DE COMPRA
                    </span>
                    <span id="contadorItems" class="text-[10px] bg-emerald-500/10 text-emerald-400 font-extrabold px-2.5 py-1 rounded-lg border border-emerald-500/20">Ticket Activo</span>
                </div>

                <!-- Lista de Carrito -->
                <div id="carritoItems" class="flex-1 overflow-y-auto custom-scroll space-y-2 pr-1 mb-2">
                    <p class="text-center text-slate-600 py-12 italic text-xs font-medium">Caja Vacía - Agregue productos</p>
                </div>

                <!-- Bloque Inferior de Pagos -->
                <div class="space-y-2.5 pt-2.5 border-t border-slate-800 flex-shrink-0">
                    <div>
                        <span class="text-[10px] font-extrabold text-slate-400 uppercase tracking-wider">MÉTODO DE PAGO:</span>
                        <div class="grid grid-cols-3 gap-1.5 mt-1">
                            <button type="button" id="btnEfectivo" onclick="seleccionarMetodo('Efectivo')" class="metodo-pago border border-emerald-500 bg-emerald-500/10 text-emerald-400 py-1.5 rounded-xl font-bold text-xs shadow-sm transition">EFECTIVO</button>
                            <button type="button" id="btnYape" onclick="seleccionarMetodo('Yape')" class="metodo-pago border border-slate-800 bg-slate-900 text-slate-400 py-1.5 rounded-xl font-bold text-xs hover:bg-slate-800 transition">YAPE</button>
                            <button type="button" id="btnPlin" onclick="seleccionarMetodo('Plin')" class="metodo-pago border border-slate-800 bg-slate-900 text-slate-400 py-1.5 rounded-xl font-bold text-xs hover:bg-slate-800 transition">PLIN</button>
                        </div>
                    </div>

                    <!-- Panel Vuelto / Fiado compacto -->
                    <div id="panelVuelto" class="space-y-1.5 bg-slate-900/80 p-2.5 rounded-xl border border-slate-800/80">
                        <div class="flex items-center justify-between text-xs">
                            <span class="font-bold text-slate-400 uppercase text-[10px]">PAGA CON:</span>
                            <input type="number" id="pagaCon" placeholder="0.00" class="w-24 bg-slate-950 border border-slate-700 text-right px-2.5 py-1 rounded-lg font-bold text-emerald-400 text-xs outline-none focus:ring-1 focus:ring-emerald-500">
                        </div>
                        <div class="flex items-center justify-between text-xs">
                            <span class="font-bold text-slate-400 uppercase text-[10px]">VUELTO:</span>
                            <span id="vuelto" class="font-black text-emerald-400 text-sm">$0.00</span>
                        </div>
                        <div class="flex items-center justify-between pt-1">
                            <div class="flex items-center gap-1.5">
                                <input type="checkbox" id="esFiado" class="w-3.5 h-3.5 accent-emerald-500 rounded cursor-pointer">
                                <label for="esFiado" class="text-[10px] font-bold text-slate-300 cursor-pointer">DAR FIADO</label>
                            </div>
                            <div id="contenedorSelectorCliente" class="hidden flex-1 ml-2">
                                <select id="selectCliente" class="w-full bg-slate-950 border border-slate-700 text-white text-[10px] p-1.5 rounded-lg outline-none font-bold">
                                    <option value="">-- Cliente --</option>
                                </select>
                            </div>
                        </div>
                    </div>

                    <!-- Total y Botón de Cobro -->
                    <div class="bg-slate-900 p-3 rounded-xl border border-slate-800 flex items-center justify-between shadow-inner">
                        <span class="text-xs font-extrabold text-slate-400 uppercase">TOTAL:</span>
                        <span id="totalVenta" class="text-2xl font-black text-emerald-400">$0.00</span>
                    </div>

                    <button id="btnFinalizarVenta" class="w-full bg-gradient-to-r from-emerald-500 to-teal-500 hover:from-emerald-600 hover:to-teal-600 text-slate-950 font-black py-3 rounded-xl shadow-lg transition transform active:scale-95 text-xs tracking-wide">
                        FINALIZAR VENTA (F2)
                    </button>
                </div>

            </div>

        </div>
    </div>

    <!-- Scripts externos y lógica -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <script src="ventas.js"></script>
</body>
</html>
