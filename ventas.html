<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Caja Rápida - Minimarket Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #090d16; overflow: hidden; }
        .custom-scroll::-webkit-scrollbar { width: 6px; }
        .custom-scroll::-webkit-scrollbar-track { background: #0f172a; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        
        /* FUERZA BRUTA PARA EL TEXTO DE LA TABLA: Blanco brillante absoluto */
        #tablaResultados, #tablaResultados *, #tablaResultados td, #tablaResultados span {
            color: #ffffff !important;
        }
        #tablaResultados tr:hover td, #tablaResultados tr:hover span {
            color: #34d399 !important;
        }
    </style>
</head>
<body class="h-screen flex flex-col p-2 gap-2 overflow-hidden">

    <!-- Contenedor Principal POS -->
    <div class="bg-slate-900 flex-1 rounded-2xl shadow-2xl flex flex-col overflow-hidden border border-slate-800">
        
        <!-- Cabecera -->
        <div class="bg-gradient-to-r from-emerald-600 via-teal-600 to-emerald-700 px-4 py-2 flex items-center justify-between text-white shadow-lg flex-shrink-0">
            <div class="flex items-center gap-2.5">
                <span class="text-xl bg-white/10 p-1 rounded-lg">🛒</span>
                <div>
                    <h1 class="text-xs font-black tracking-wider uppercase">Caja Registradora</h1>
                    <p class="text-[9px] text-emerald-100 font-semibold">TERMINAL DE VENTA RÁPIDA</p>
                </div>
            </div>
            <p class="text-xs font-bold uppercase bg-slate-950/30 px-3 py-1 rounded-lg border border-white/10" id="user-display">Verificando...</p>
        </div>

        <!-- Layout de 2 Columnas -->
        <div class="flex-1 grid grid-cols-1 lg:grid-cols-12 p-2.5 gap-2.5 overflow-hidden">
            
            <!-- Izquierda: Buscador y Tabla de Inventario -->
            <div class="lg:col-span-7 flex flex-col gap-2 overflow-hidden bg-slate-950/50 p-2.5 rounded-xl border border-slate-800 shadow-inner">
                
                <!-- Buscador -->
                <div class="flex items-center gap-2 bg-slate-900 p-2 rounded-xl border border-slate-700 shadow-md flex-shrink-0">
                    <div class="flex-1 relative flex items-center">
                        <input type="text" id="inputBusqueda" placeholder="🔍 BUSCAR PRODUCTO O ESCANEAR CÓDIGO (F3)..." class="w-full bg-slate-950 px-3 py-2 rounded-lg font-bold text-white placeholder-slate-400 outline-none focus:ring-2 focus:ring-emerald-500 text-xs">
                    </div>
                    <button id="btnCamara" onclick="toggleLector()" class="bg-slate-800 hover:bg-slate-700 text-emerald-400 border border-slate-700 px-3 py-2 rounded-lg font-bold text-xs flex items-center gap-1 shadow transition">
                        <span>📷</span> Cámara
                    </button>
                </div>

                <!-- Lector de Cámara -->
                <div id="lectorContainer" class="hidden relative bg-black rounded-xl overflow-hidden h-28 flex-shrink-0 border border-slate-800">
                    <div id="reader" class="w-full h-full"></div>
                </div>

                <!-- Tabla de Productos -->
                <div class="flex-1 overflow-y-auto custom-scroll border border-slate-800 rounded-xl bg-slate-900 shadow-lg">
                    <table class="w-full text-left border-collapse">
                        <thead class="bg-slate-800 text-slate-200 uppercase text-[11px] sticky top-0 font-extrabold z-10 tracking-wider">
                            <tr>
                                <th class="p-2.5">Descripción</th>
                                <th class="p-2.5">Precio</th>
                                <th class="p-2.5">Stock</th>
                                <th class="p-2.5 text-center">Acción</th>
                            </tr>
                        </thead>
                        <tbody id="tablaResultados" class="divide-y divide-slate-800 text-xs font-bold">
                            <!-- Productos inyectados por ventas.js -->
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- Derecha: Panel de Resumen -->
            <div class="lg:col-span-5 bg-slate-950 text-white rounded-xl p-2.5 flex flex-col justify-between shadow-xl border border-slate-800 overflow-hidden">
                
                <!-- Cabecera Resumen -->
                <div class="flex items-center justify-between border-b border-slate-800 pb-1.5 mb-1.5 flex-shrink-0">
                    <span class="font-extrabold text-[11px] uppercase tracking-wider text-slate-300 flex items-center gap-1.5">
                        <span>📄</span> RESUMEN DE COMPRA
                    </span>
                    <span id="contadorItems" class="text-[9px] bg-emerald-500/10 text-emerald-400 font-extrabold px-2 py-0.5 rounded border border-emerald-500/20">Ticket Activo</span>
                </div>

                <!-- Lista de Carrito -->
                <div id="carritoItems" class="flex-1 overflow-y-auto custom-scroll space-y-1.5 pr-1 mb-1.5 text-white">
                    <p class="text-center text-slate-500 py-10 italic text-xs font-medium">Caja Vacía - Agregue productos</p>
                </div>

                <!-- Bloque Inferior Completo -->
                <div class="space-y-2 pt-1.5 border-t border-slate-800 flex-shrink-0">
                    
                    <!-- Métodos de Pago (Incluyendo Pago Mixto) -->
                    <div>
                        <span class="text-[9px] font-extrabold text-slate-400 uppercase tracking-wider">MÉTODO DE PAGO:</span>
                        <div class="grid grid-cols-4 gap-1 mt-0.5">
                            <button type="button" id="btnEfectivo" onclick="seleccionarMetodo('Efectivo')" class="metodo-pago border border-emerald-500 bg-emerald-500/10 text-emerald-400 py-1 rounded-lg font-bold text-[11px] shadow-sm">EFECTIVO</button>
                            <button type="button" id="btnYape" onclick="seleccionarMetodo('Yape')" class="metodo-pago border border-slate-800 bg-slate-900 text-slate-400 py-1 rounded-lg font-bold text-[11px] hover:bg-slate-800">YAPE</button>
                            <button type="button" id="btnPlin" onclick="seleccionarMetodo('Plin')" class="metodo-pago border border-slate-800 bg-slate-900 text-slate-400 py-1 rounded-lg font-bold text-[11px] hover:bg-slate-800">PLIN</button>
                            <button type="button" id="btnMixto" onclick="seleccionarMetodo('Mixto')" class="metodo-pago border border-slate-800 bg-slate-900 text-purple-400 py-1 rounded-lg font-bold text-[11px] hover:bg-slate-800">MIXTO</button>
                        </div>
                    </div>

                    <!-- Panel Vuelto / Pago Normal -->
                    <div id="panelVuelto" class="space-y-1 bg-slate-900/90 p-2 rounded-lg border border-slate-800 text-xs">
                        <div class="flex items-center justify-between">
                            <span class="font-bold text-slate-400 uppercase text-[9px]">PAGA CON:</span>
                            <input type="number" id="pagaCon" placeholder="0.00" class="w-20 bg-slate-950 border border-slate-700 text-right px-1.5 py-0.5 rounded font-bold text-emerald-400 text-xs outline-none">
                        </div>
                        <div class="flex items-center justify-between">
                            <span class="font-bold text-slate-400 uppercase text-[9px]">VUELTO:</span>
                            <span id="vuelto" class="font-black text-emerald-400 text-xs">$0.00</span>
                        </div>
                    </div>

                    <!-- Panel Pago Mixto (Oculto por defecto, se muestra al elegir Mixto) -->
                    <div id="panelMixto" class="hidden space-y-1 bg-purple-950/30 p-2 rounded-lg border border-purple-900/50 text-xs">
                        <div class="flex items-center justify-between">
                            <span class="font-bold text-purple-300 uppercase text-[9px]">EFECTIVO PARCIAL:</span>
                            <input type="number" id="mixtoEfectivo" placeholder="0.00" class="w-20 bg-slate-950 border border-purple-700 text-right px-1.5 py-0.5 rounded font-bold text-emerald-400 text-xs outline-none">
                        </div>
                        <div class="flex items-center justify-between">
                            <span class="font-bold text-purple-300 uppercase text-[9px]">YAPE / PLIN PARCIAL:</span>
                            <input type="number" id="mixtoVirtual" placeholder="0.00" class="w-20 bg-slate-950 border border-purple-700 text-right px-1.5 py-0.5 rounded font-bold text-emerald-400 text-xs outline-none">
                        </div>
                        <div class="flex items-center justify-between pt-0.5 border-t border-purple-900/40">
                            <span class="font-bold text-slate-400 uppercase text-[9px]">VUELTO EFECTIVO:</span>
                            <span id="mixtoVuelto" class="font-black text-emerald-400 text-xs">$0.00</span>
                        </div>
                    </div>

                    <!-- Checkbox de Fiado -->
                    <div class="flex items-center justify-between px-1">
                        <div class="flex items-center gap-1">
                            <input type="checkbox" id="esFiado" class="w-3 h-3 accent-emerald-500 rounded cursor-pointer">
                            <label for="esFiado" class="text-[9px] font-bold text-slate-300 cursor-pointer">DAR FIADO</label>
                        </div>
                        <div id="contenedorSelectorCliente" class="hidden flex-1 ml-2">
                            <select id="selectCliente" class="w-full bg-slate-950 border border-slate-700 text-white text-[9px] p-0.5 rounded outline-none font-bold">
                                <option value="">-- Cliente --</option>
                            </select>
                        </div>
                    </div>

                    <!-- Total y Botón de Cobro -->
                    <div class="bg-slate-900 px-3 py-1.5 rounded-lg border border-slate-800 flex items-center justify-between">
                        <span class="text-[10px] font-extrabold text-slate-400 uppercase">TOTAL:</span>
                        <span id="totalVenta" class="text-xl font-black text-emerald-400">$0.00</span>
                    </div>

                    <button id="btnFinalizarVenta" class="w-full bg-gradient-to-r from-emerald-500 to-teal-500 hover:from-emerald-600 hover:to-teal-600 text-slate-950 font-black py-2 rounded-xl shadow-lg transition transform active:scale-95 text-xs tracking-wide">
                        FINALIZAR VENTA (F2)
                    </button>
                </div>

            </div>

        </div>
    </div>

    <!-- Script complementario para manejar la vista del Pago Mixto en la interfaz -->
    <script>
        function seleccionarMetodo(metodo) {
            // Limpiar estilos activos de botones
            document.querySelectorAll('.metodo-pago').forEach(btn => {
                btn.className = "metodo-pago border border-slate-800 bg-slate-900 text-slate-400 py-1 rounded-lg font-bold text-[11px] hover:bg-slate-800";
            });

            const panelVuelto = document.getElementById('panelVuelto');
            const panelMixto = document.getElementById('panelMixto');

            if (metodo === 'Mixto') {
                document.getElementById('btnMixto').className = "metodo-pago border border-purple-500 bg-purple-500/10 text-purple-400 py-1 rounded-lg font-bold text-[11px] shadow-sm";
                panelVuelto.classList.add('hidden');
                panelMixto.classList.remove('hidden');
            } else {
                const btnActivo = document.getElementById('btn' + metodo);
                btnActivo.className = "metodo-pago border border-emerald-500 bg-emerald-500/10 text-emerald-400 py-1 rounded-lg font-bold text-[11px] shadow-sm";
                panelVuelto.classList.remove('hidden');
                panelMixto.classList.add('hidden');
            }
        }
    </script>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <script src="ventas.js"></script>
</body>
</html>
